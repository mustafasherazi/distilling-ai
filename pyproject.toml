[project]
name = "distilling-ai"
version = "0.1.0"
description = "Code for mustafasherazi.com: the full LLM stack on one 16GB GPU, one layer at a time."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
    "truststore>=0.10.5",
]

[project.optional-dependencies]
# PyTorch with CUDA 12.8 wheels (works on RTX 40-series / Ada). Install with: uv sync --extra torch
torch = ["torch>=2.8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", extra = "torch" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
